name: K9Desktop Autobuild

on:
  schedule:
    - cron: "0 0 * * 0"   # weekly, free GitHub Actions tier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed git git-lfs curl python rsync tar xz zstd binutils dpkg rpm

      - name: Checkout (no Node-based actions)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "k9-desktop"
          git config --global user.email "k9-desktop@acreetionos.org"
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" .
          git lfs install
          pwd
          ls -la
          git status
          git lfs pull

      - name: Run autobuild
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x scripts/autobuild.sh
          ./scripts/autobuild.sh

      - name: Package (deb, rpm, arch)
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -S --noconfirm --needed github-cli
          ESR=$(curl -s https://product-details.mozilla.org/1.0/thunderbird_versions.json | python3 -c "import sys,json; print(json.load(sys.stdin)['THUNDERBIRD_ESR'])")
          VER="${ESR%esr}"
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "Release already exists; uploading assets"
          else
            gh release create "v${VER}" --title "K9Desktop ${VER}" --notes "Autobuild based on Mozilla Thunderbird LTS ${ESR}. Packaged as deb, rpm, and Arch tarball."
          fi
          for f in dist/*; do
            [ -e "$f" ] && gh release upload "v${VER}" "$f" --clobber
          done